[workspace]
members = [
    "crates/agentos-cli",
    "crates/agentos-core",
    "crates/agentos-interfaces",
    "crates/agentos-llm",
    "crates/agentos-proto",
    "extensions/memory/agentos-memory-vector",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jiyuan/AgentOS"
# Unpublished, and this says so rather than leaving it to be discovered.
# `cargo-semver-checks` already needs `--baseline-rev` because there is no
# crates.io baseline; stating it here makes the same fact machine-readable, and
# it is what lets `deny.toml` allow `path = "…"` workspace dependencies while
# still refusing a wildcard version on an external crate (M9 / `CI-002`).
# Removing this line for a crate is the deliberate act of publishing it, and it
# will then require real version requirements on its path dependencies.
publish = false

[workspace.dependencies]
agentos-core = { path = "crates/agentos-core" }
agentos-interfaces = { path = "crates/agentos-interfaces" }
agentos-llm = { path = "crates/agentos-llm" }
agentos-memory-vector = { path = "extensions/memory/agentos-memory-vector" }
agentos-proto = { path = "crates/agentos-proto" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
croner = "3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1.9"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", default-features = false }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
