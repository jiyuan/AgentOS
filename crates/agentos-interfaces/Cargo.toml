[package]
name = "agentos-interfaces"
# `ToolSpec` gained authorization metadata in CFG-002. This is a source-level
# breaking change for downstream struct literals, so the interface crate moves
# to the next pre-1.0 compatibility line even though the runtime stays v0.7.
version = "0.8.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
# Enables `agentos_interfaces::test_support`: deterministic Mock* impls for every
# public trait. On by default in `cfg(test)`; downstream crates opt in with
# `agentos-interfaces = { workspace = true, features = ["test-support"] }`.
test-support = []

[dependencies]
agentos-proto.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
