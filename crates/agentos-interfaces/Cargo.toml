[package]
name = "agentos-interfaces"
# GW-002 replaces the process-global receive cursor with an event-bound
# ACK/checkpoint receipt. That intentionally breaks the pre-1.0 channel API.
version = "0.11.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
# Enables `agentos_interfaces::test_support`: deterministic Mock* impls for every
# public trait. On by default in `cfg(test)`; downstream crates opt in with
# `agentos-interfaces = { workspace = true, features = ["test-support"] }`.
test-support = []

[dependencies]
agentos-proto.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
