[package]
name = "agentos-core"
# AUTH-004 replaces reusable standing grants with bounded, principal-bound
# runtime grant instances. That intentionally advances the pre-1.0 API line.
version = "0.10.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
agentos-interfaces.workspace = true
agentos-llm.workspace = true
agentos-proto.workspace = true
async-trait.workspace = true
chrono.workspace = true
croner.workspace = true
getrandom.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Landlock and `prctl` for the Linux sandbox (roadmap X2): raw syscalls, no
# wrapper crate, because the surface used is three numbers and two structs.
libc = "0.2"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "http2", "json", "multipart"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# Digests for the safety-event log: an audit row names the call it decided
# without copying the call's arguments (M6 / ADR-0005). Pinned to 0.10 so it
# shares the `digest` version already in the tree.
sha2 = "0.10"
sqlite-vec.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "fs", "process", "time"] }
tokio-util.workspace = true
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
agentos-interfaces = { workspace = true, features = ["test-support"] }
criterion = "0.5"
proptest = "1"
# `test-util` for the paused clock: the shard tests assert scheduling order
# under a 30-second stall, which must not cost 30 seconds of wall time.
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "loop_overhead"
harness = false

[[bench]]
name = "tool_turn"
harness = false

[[bench]]
name = "pause_resume"
harness = false

[[bench]]
name = "memory_turn"
harness = false

[[bench]]
name = "concurrency"
harness = false

[[bench]]
name = "alloc_count"
harness = false
