# CI for Agent OS. Wires the existing manual verification matrix
# (docs/PLAN.md "Ongoing Verification Matrix") into GitHub Actions — no new
# policy, just machine enforcement of the checks contributors already run.
#
# Scheduled as Phase 1.3 of docs/OPTIMIZATION_ROADMAP.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, boundaries, module size, catalogs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Type check
        run: cargo check --workspace
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace -- -D warnings
      - name: Import boundaries
        run: bash scripts/check-import-boundaries.sh
      - name: Module size ceiling
        run: bash scripts/check-module-size.sh
      - name: Provider calls go through the request gateway
        run: bash scripts/check-provider-calls.sh
      - name: Generated catalogs are current
        run: bash scripts/check-catalogs.sh

  # Both supported platforms, not just the cheap one. macOS is the point of the
  # matrix rather than a bonus: it is the only place Seatbelt exists, and
  # tests/sandbox.rs now *fails* rather than skips when a supported target
  # cannot enforce a sandbox, so this job is what makes that assertion real
  # (M2 / `CI-001`).
  test:
    name: workspace tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --locked
      # A skip here means the runner could not enforce a sandbox, which the
      # suite now treats as a failure. Named separately so the log says which
      # mechanism was in force rather than leaving it to be inferred.
      - name: Report the sandbox mechanism
        run: cargo test -p agentos-core --locked --test sandbox -- --nocapture

  bench-smoke:
    name: bench compile + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Smoke mode only: CI runners are too noisy to gate on timings, so this
      # proves every bench (criterion and custom harnesses) still compiles
      # and runs, nothing more.
      - name: Smoke-run benches
        run: cargo bench -p agentos-core --locked -- --test

  release-smoke:
    name: clean-room release archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Packages an archive, extracts it, installs from both the archive and
      # the source checkout into isolated prefixes under a redirected HOME,
      # validates every packaged documentation link, and completes one offline
      # `builtin.echo` turn with no repository reachable. That last step is §5
      # of docs/AUDIT_REMEDIATION_PLAN.md's definition of done, and nothing
      # exercised it before this job existed.
      - name: Clean-room archive and install check
        run: bash scripts/check-release-archive.sh

  semver-checks:
    name: semver-checks (advisory)
    runs-on: ubuntu-latest
    # Advisory while interface evolution policy settles: surfaces breaking
    # changes in the job log without blocking the merge. Flip to required
    # before tagging a release.
    continue-on-error: true
    steps:
      # Full history so the git baseline below is reachable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # These crates are unpublished, so the default crates.io baseline can't be
      # fetched. Compare against the PR base commit (or the previous commit on a
      # push) via git instead. Reported as a warning, not a hard failure, so the
      # advisory job stays green while the diff is still visible in the log.
      - name: Check interface crates
        run: |
          baseline="${{ github.event.pull_request.base.sha }}"
          [ -z "$baseline" ] && baseline="HEAD^"
          echo "semver baseline: $baseline"
          for crate in agentos-interfaces agentos-proto; do
            cargo semver-checks check-release -p "$crate" --baseline-rev "$baseline" \
              || echo "::warning::$crate: semver-checks reported changes vs $baseline (advisory; see log)"
          done
