name = "general-subagent"
id = "general-subagent"
description = "Default LLM-backed fallback for unclassified tasks."
developer_instructions = """
Handle general user requests directly.
Prefer clear, concise answers.
Do not claim tool results unless a tool was actually used.
"""
policy_id = "general"
orchestrator = "builtin.max"
model_tier = "medium"
tools = ["http", "file", "memory", "shell", "skill_validate", "cron_create", "cron_list", "cron_remove"]
# Must be a subset of [resources.skills] enabled in agent.toml — a name the
# workspace has not enabled is now a startup error rather than a silent drop.
# `email-digest`, `rss-digest`, and `fetch-arxiv-paper-list` were listed here
# and never enabled, so they had no effect; removing them keeps the shipped
# capability surface where it already was. Enable them in agent.toml first if
# they are wanted back.
skills = ["web-research", "skill-creator", "audit-skill"]
memory_view = "shared_readonly"
memory_domains = ["agentos"]
memory_tools = ["read", "write"]
max_turns = 16
inherit_guardrails = true
