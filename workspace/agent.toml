# This agent's identity. It is stamped on every trace, episode, memory record,
# and safety event, and is part of the principal those are keyed by — so two
# deployments sharing a store keep separate memory only if they have separate
# ids. It used to be read by nothing: the runtime hardcoded `main-agent`.
[agent]
id = "default"
orchestrator = "builtin.max"
# `agent.memory` is deprecated and ignored; the backend is `[memory].backend`.
# Tool cycles one run may take. A model that asks for several tools in one
# response spends one turn per call — they run in order, each crossing the
# policy engine on its own — so a batch is bounded by this like any other work.
max_turns = 256

[policy]
default = "deny"
# Naming a tool here turns it into a blanket `Allow`, discarding the
# operation-level rules the built-in path would have produced. So only tools
# whose every operation is safe belong here: `shell`, `file`, and `memory` are
# deliberately absent, which leaves them on their built-in rules — `file` read
# allowed and `file` write asked, `memory` read allowed and write/forget asked
# (`[memory.policy]`), and every `shell` call asked.
allowlist = ["job_status", "job_output", "job_kill"]

# Programs the shell tool guardrail accepts in a call's `command` field.
# These eight are read-only inspection commands (the built-in default).
# A program that can be argued into running other code does not belong here;
# give it a profile below instead.
[guardrails]
shell_allowlist = ["printf", "echo", "pwd", "ls", "find", "cat", "head", "tail"]

# Programs whose structured `args` array is checked too. Naming a program here
# also admits it, so a profiled program need not repeat itself above.

# `find` is in the allowlist, and its action predicates run other programs and
# delete files. Without this the read-only inspection set ships an arbitrary
# code execution primitive as `find . -exec sh -c '<payload>' \;`.
[[guardrails.shell_profiles]]
program = "find"
deny_args = ["-exec", "-execdir", "-ok", "-okdir", "-delete", "-fprint", "-fprint0", "-fprintf", "-fls"]

# `python3` is admitted only as `python3 <script>.py [script args...]`, which
# is the shape the bundled skill scripts use (audit-skill, skill-creator, and
# the email-digest / rss-digest fetchers). Pinning the first argument to a
# script path is what makes it safe: python only reads `-c`, `-m`, `-i` and a
# bare `-` in that position, so once it holds a path every later argument goes
# to the script rather than to the interpreter. Writing a new script to run
# this way needs a `file` write, which the policy above sends to approval.
[[guardrails.shell_profiles]]
program = "python3"
require_first_arg_suffix = [".py"]

[memory]
backend = "sqlite"
default_domain = "general"
hydration_enabled = true
hydrate_max_fragments = 5
hydrate_max_estimated_tokens = 1200
hydrate_stores = ["semantic", "episodic"]
# Record an episodic memory after each non-trivial run (failures, denials,
# approvals, multi-step/tool/sub-agent runs, explicit writes). Set false to
# disable all long-term memory writes from runs.
episode_recording_enabled = true
# Semantic retrieval index:
#   "sqlite_vec" (default) — persistent, but hashing-based (lexical-vector).
#   "qdrant"               — external Qdrant server.
#   "vector"               — the agentos-memory-vector extension crate, injected
#                            by the CLI (core never depends on it). Uses a real
#                            embeddings API when AGENTOS_EMBEDDINGS_* / OPENAI_API_KEY
#                            is set (paraphrase-capable retrieval), else an offline
#                            hashing fallback. In-memory: rebuilt from writes after
#                            a restart. Choose "vector" for real semantics,
#                            "sqlite_vec" for persistence.
#   "none"                 — lexical (FTS) retrieval only.
semantic_backend = "sqlite_vec"

[memory.sqlite_vec]
table = "memory_records_vec"
vector_dimensions = 384

# Scheduled whole-memory reflection: promotes repeated episodes into semantic
# facts, supersedes contradicted facts, and rebuilds the lexical index off the
# run hot path. Driven by the persistent gateway's idle tick.
[memory.reflection]
enabled = true
schedule = "0 3 * * *"  # daily at 03:00 (minute-resolution cron)
min_episode_repetitions = 2
rebuild_lexical_index = true

[memory.retention]
max_records = 10000

[memory.policy]
writes = "ask_user"
forgets = "ask_user"
shared_writes = false

[[memory.shared_domains]]
name = "agentos"
read = true
write = false

# Streaming forwards each chunk of an answer as the model writes it, which is
# before the output guardrails have run and after the terminal has already
# printed it. Left off: a deployment that prefers latency to that guarantee
# should be the one that says so. See docs/adr/0007-BUFFERED_OUTPUT.md.
[channels]
provisional_streaming = false

[channels.tui]
enabled = true
mode = "interactive"

[channels.telegram]
enabled = false
mode = "poll_once"

[channels.feishu]
enabled = false
mode = "long_connection"

# Sizes a deployment has real reason to change. Omit the section to keep the
# defaults; every key here is optional and an unknown key fails the load.
[limits]
# Bytes of a tool result kept inline in the transcript. Anything past this is
# written to the spill store and the inline text becomes a preview plus a
# `spill:` locator, which the model reads back with the spill_read tool. The
# locator is not a path: it names a place in the store, and spill_read only
# resolves one this conversation's own transcript already cites. Minimum 512.
tool_result_inline_bytes = 65536
# How long a tool may run before it is stopped and reported as failed, in
# milliseconds. A tool that declares its own deadline (the shell tool asks for
# five minutes) keeps it unless overridden below. Minimum 100.
tool_timeout_ms = 60000

# Entries the `file` tool lists before truncating. A cap on what one turn puts
# in front of the model, not on what the directory holds. Minimum 1.
directory_list_entries = 200
# Bytes the `file` tool reads when a call does not ask for a size, and the
# ceiling it will read however much a call asks for. Minimum 256 each, and the
# default may not exceed the ceiling.
file_read_bytes = 65536
file_read_max_bytes = 262144
# Bytes captured from each of a child process's stdout and stderr before the
# rest is read and discarded. Bounds memory against a runaway process; what the
# model sees is shaped by tool_result_inline_bytes and the spill store above.
# Minimum 1024.
tool_output_bytes = 4194304

# Per-tool deadlines. These win over both the default above and a tool's own
# declaration, so this is the last word on how long this machine will wait.
[limits.tool_timeout_overrides]
shell = 300000

# When a conversation summarizes its own history. The session log is never
# rewritten — a pass appends one checkpoint item and the projection folds the
# range it covers out of what the model sees, so the full history stays on disk.
[compaction]
enabled = true
# Percent of the model's context window above which the next turn summarizes
# its oldest turns first. Above the 80% at which oversized tool output is
# elided for free, so pruning always gets the first attempt. 84 is measured,
# not chosen: the token estimator's worst under-estimate is 18.8%
# (docs/TOKEN_CALIBRATION.md), and 100 / 1.188 = 84, so a request estimated at
# 84% of the window is at most 100% of it in truth. Re-derive it with
# `agentos-gateway calibrate` if this machine changes provider — the figure
# above was measured against an OpenAI-family tokenizer.
pressure_percent = 84
# Conversation items kept verbatim after the checkpoint. Minimum 2.
retain_tail_turns = 8
# Which model tier writes the summaries: "high", "medium", or "low", chosen the
# same way AGENTOS_LLM_MODEL_<TIER> and /model choose one. Default "high" — the
# model having the conversation. A cheaper tier is a real saving and a real
# trade: the summary is what the model reads for every later turn, so a weaker
# one lowers the ceiling invisibly.
model = "high"

# Where oversized tool output is written, and how long it is kept. A spill
# artifact is whatever a tool read or fetched, so it is the most sensitive thing
# this runtime puts on disk.
[spill]
# Relative to the workspace root; an absolute path is taken as given, for a
# deployment that wants spill on a different volume. A relative path may not
# climb above the workspace.
root = "spill"
# Days an artifact is kept, or 0 to keep everything. Swept from the gateway's
# idle phase, a whole run's artifacts at a time. Minimum 1 when set — a shorter
# window would race the run that wrote it, which is the destroyed-output
# behaviour spill exists to replace.
retention_days = 0
# Bytes all artifacts may occupy together, or 0 for no ceiling. Applied after
# retention_days, oldest run first. An age ceiling alone bounds nothing: one
# afternoon of a tool reading large files outweighs a quiet month, and it is
# the afternoon that fills the disk. Minimum 1 MiB when set.
max_bytes = 0

# Background work. A tool that outlives its deadline becomes a job instead of
# being killed, and the model follows it with job_status / job_output / job_kill.
[jobs]
# Jobs one conversation may have running at once. Per conversation, not per
# process, so one runaway model starves only itself. Minimum 1 — to turn jobs
# off, drop the job_* tools from [resources.tools] instead.
max_concurrent = 4
# Bytes of output a job retains before discarding the rest. Minimum 1024.
output_limit_bytes = 262144
# Seconds a finished job stays answerable by job_status / job_output before the
# registry forgets it, or 0 to keep it until the conversation is cleared. This
# is memory: max_concurrent counts only *running* jobs, so without this a
# gateway holds every job it has ever run. Minimum 60 when set.
completed_retention_secs = 3600
# Tools that become a job rather than failing when they exceed their deadline.
# An allowlist because a promoted call is re-issued without the run context: no
# built-in tool but `memory` uses that context, but a third-party tool might,
# and dropping caller identity for a tool that authorises on it would be a
# security bug rather than a degraded result.
promotable = ["shell"]

# How the persistent gateway spreads conversations over threads. Conversations
# run concurrently with each other and strictly serially within themselves: two
# runs on one conversation would both load its transcript and the second
# write-back would drop the first one's turns.
[gateway]
# Shard threads, or 0 for one per core. The run loop's future is !Send, so a run
# cannot migrate between threads; conversations are hashed onto a fixed shard
# instead. More shards means more conversations at once, never one conversation
# going faster. Maximum 64.
shards = 0
# Messages one conversation may have waiting for a run of their own. Per
# conversation, so a user typing faster than the agent answers hits their own
# bound and nobody else's. A message that arrives while that conversation's run
# is already in flight does not queue here at all — it is handed to the running
# turn and claimed at its next planning step. Minimum 1.
inbox_capacity = 32
# Seconds SIGTERM waits for in-flight turns before exiting anyway. The router
# stops accepting immediately; this bounds the drain. 0 means do not wait.
# Maximum 600.
shutdown_grace_secs = 30

# Retention for the stores nothing else bounds. Swept from the gateway's idle
# phase under its own lease, so two channels' shard sets do not walk the same
# directory at once.
#
# Deliberately absent from this section: the session log and the two audit
# stores (safety_events, memory_access_log). Those are the record rather than a
# by-product, and nothing deletes from them on a timer — `agentos-gateway purge
# --sessions --before DATE` and `--audit --before DATE` report first and apply
# only when an operator types the count back. See ADR-0005 and ADR-0006.
[retention]
# Days a run's trace file is kept, and bytes all traces may occupy together.
# 0 means no ceiling. Off by default: a trace is what you read to find out what
# the agent actually did, and an upgrade is not the moment to discover a month
# of them has gone. Minimum 1 day / 1 MiB when set.
trace_days = 0
trace_max_bytes = 0
# The same, for inbound attachments. The unit is one message's directory, not
# one file: a message that arrived with three images was answered by a turn
# that saw all three.
attachment_days = 0
attachment_max_bytes = 0
# Days a *settled* ingress ledger row is kept. Unsettled rows are never swept
# at any age — they are the record of a message accepted and never finished.
# On by default: no transport this runtime speaks redelivers an event it was
# acknowledged for a month earlier.
ingress_days = 30
# Bytes the gateway log may reach before it rotates, and how many rotations are
# kept beside the live file. 0 bytes means one growing file.
gateway_log_max_bytes = 33554432
gateway_log_keep = 3

# Approvals. A prompt names itself with a short ticket, and only an answer
# carrying that ticket decides it — /approve <ticket>, /deny <ticket>, or the
# inline buttons on channels that render them. Anything else is ordinary input.
[approval]
# Seconds a prompt counts for, or 0 for no expiry. An expired prompt is
# resolved as *cancelled*, not rejected: the action does not run either way,
# but the audit trail must not record a refusal nobody made. Minimum 30,
# maximum 86400.
expiry_seconds = 900

# Tools that declare a sandbox mode run in a child process the kernel holds to
# it — Landlock on Linux, Seatbelt on macOS. `agentos-gateway config` prints
# which mechanism this machine enforces with; where there is none, a sandboxed
# tool fails rather than running unsandboxed.
[isolation]
worker_path_env = "AGENTOS_TOOL_WORKER_PATH"

[resources]
priority = ["skills", "tools", "mcp", "llm"]

[resources.skills]
enabled = ["skill-creator", "web-research", "audit-skill"]

[resources.tools]
enabled = ["file", "http", "memory", "shell", "skill_validate", "cron_create", "cron_list", "cron_remove", "job_status", "job_output", "job_kill", "spill_read"]

[resources.mcp]
enabled = ["remote_echo"]

# `[resources.llm]` is deprecated and ignored: whether the LLM fallback is
# offered is decided by listing "llm" in [resources].priority above.

[task_workspace]
root = "tasks"

[[mcp_servers]]
id = "static-mcp"
endpoint = "static://local"
timeout_ms = 10000

[[mcp_tools]]
server_id = "static-mcp"
name = "remote_echo"
description = "Static MCP-backed echo tool"
response = "static MCP response"

# Routing: deterministic skill/diagnostic routes always apply. The LLM
# classifier (one extra model round-trip per routed turn) only runs when the
# input shares vocabulary with a specialized rule below; set
# `llm_classifier = false` to never spend that round-trip and send unmatched
# input straight to the fallback.
[routing]
llm_classifier = true

[[routing.rules]]
domain = "software_dev"
description = "Implementation, debugging, submitted issue fixes, regressions, tests, architecture, code review, and repository maintenance."
examples = [
  "fix this failing test",
  "fix the bug described in this issue",
  "implement the orchestrator plan",
  "review the TUI code path",
]
dispatch = "escalate"
template = "software-dev"

[[routing.rules]]
domain = "skill_ops"
description = "Authoring, editing, or rebuilding a skill bundle: modifying a workspace/skills/<name>/SKILL.md or its scripts and then validating the bundle. Distinct from general code fixes."
examples = [
  "update the audit skill",
  "rebuild the audit-skill SKILL.md",
  "edit the skill-creator skill bundle",
  "fix the audit skill and revalidate it",
]
dispatch = "delegate"
agent_id = "skill-editor-subagent"
policy_id = "skill-edit"

[[routing.rules]]
domain = "content_ops"
description = "Content planning, publishing, campaigns, editorial workflows, and content operations."
examples = [
  "draft a campaign plan",
  "prepare this post for publishing",
]
dispatch = "escalate"
template = "content-ops"

[[routing.rules]]
domain = "research"
description = "Investigation, source review, evidence gathering, comparison, and synthesis."
examples = [
  "compare these sources",
  "investigate the latest implementation options",
]
dispatch = "escalate"
template = "research"

[[routing.rules]]
domain = "editing"
description = "Rewrite, proofread, copy edit, clarify, or improve existing prose without changing the underlying task."
examples = [
  "rewrite this message",
  "proofread this section",
]
dispatch = "delegate"
agent_id = "edit-subagent"
policy_id = "edit"

[routing.fallback]
domain = "general"
description = "General chat and unclassified prompts that do not clearly match a specialized route."
examples = [
  "answer this general question",
  "help me think through this",
]
dispatch = "direct"
